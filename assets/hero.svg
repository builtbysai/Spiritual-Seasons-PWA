<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="monospace" role="img" aria-label="Spiritual Seasons hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0c"/><stop offset="1" stop-color="#060807"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c948"/><stop offset="1" stop-color="#e07b39"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <rect y="5" width="6" height="1" fill="#22c55e" opacity="0.05"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="1192" height="332" rx="26" fill="url(#bg)" stroke="#1d3a26" stroke-width="2.5"/>
  <rect x="4" y="4" width="1192" height="332" rx="26" fill="url(#scan)"/>

  <!-- four season quadrants -->
  <g opacity="0.95">
    <rect x="70" y="70" width="130" height="130" rx="10" fill="#123524"/>
    <rect x="200" y="70" width="130" height="130" rx="10" fill="#3a2f10"/>
    <rect x="70" y="200" width="130" height="130" rx="10" fill="#3a2210"/>
    <rect x="200" y="200" width="130" height="130" rx="10" fill="#0f2c3a"/>
    <!-- spring: blossoming tree -->
    <g stroke="#7bd88f" stroke-width="4" stroke-linecap="round">
      <line x1="135" y1="185" x2="135" y2="130"/>
      <line x1="135" y1="150" x2="110" y2="128"/>
      <line x1="135" y1="145" x2="160" y2="122"/>
    </g>
    <g fill="#f7a8c4"><circle cx="110" cy="125" r="6"/><circle cx="160" cy="119" r="6"/><circle cx="135" cy="112" r="6"/></g>
    <!-- summer: sun -->
    <circle cx="265" cy="135" r="26" fill="url(#sun)"/>
    <g stroke="#f7c948" stroke-width="4" stroke-linecap="round">
      <line x1="265" y1="95" x2="265" y2="85"/><line x1="265" y1="175" x2="265" y2="185"/>
      <line x1="225" y1="135" x2="215" y2="135"/><line x1="305" y1="135" x2="315" y2="135"/>
      <line x1="237" y1="107" x2="230" y2="100"/><line x1="293" y1="163" x2="300" y2="170"/>
    </g>
    <!-- autumn: falling leaves -->
    <g fill="#e8843c"><ellipse cx="120" cy="250" rx="9" ry="5" transform="rotate(30 120 250)"/><ellipse cx="155" cy="275" rx="9" ry="5" transform="rotate(-25 155 275)"/><ellipse cx="135" cy="300" rx="9" ry="5" transform="rotate(15 135 300)"/></g>
    <!-- winter: bare tree + snow -->
    <g stroke="#a9c8d8" stroke-width="4" stroke-linecap="round">
      <line x1="265" y1="315" x2="265" y2="255"/>
      <line x1="265" y1="275" x2="243" y2="258"/>
      <line x1="265" y1="270" x2="287" y2="252"/>
    </g>
    <g fill="#d7e9f2"><circle cx="235" cy="225" r="3"/><circle cx="285" cy="230" r="4"/><circle cx="258" cy="215" r="3"/></g>
    <rect x="182" y="182" width="36" height="36" rx="18" fill="#0b0f0c" stroke="#22c55e" stroke-width="2"/>
    <text x="200" y="207" text-anchor="middle" font-size="20" fill="#22c55e">✦</text>
  </g>

  <text x="400" y="98" font-size="17" fill="#22c55e" letter-spacing="6">BUILTBYSAI // DEVOTIONAL PWA</text>
  <text x="398" y="160" font-size="64" fill="#f3efe4" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Spiritual Seasons</text>
  <text x="400" y="200" font-size="21" fill="#9db3a4" font-family="Georgia, 'Times New Roman', serif" font-style="italic">a 120-day devotional journey through winter, spring, summer &amp; autumn</text>

  <g font-size="15" fill="#7bd88f">
    <rect x="400" y="232" width="150" height="30" rx="15" fill="none" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="475" y="252" text-anchor="middle">120 devotionals</text>
    <rect x="562" y="232" width="150" height="30" rx="15" fill="none" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="637" y="252" text-anchor="middle">offline-first</text>
    <rect x="724" y="232" width="150" height="30" rx="15" fill="none" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="799" y="252" text-anchor="middle">journal + TTS</text>
  </g>
  <text x="400" y="300" font-size="15" fill="#4c6b57">installable PWA · meditation timer · season quizzes</text>
  <text x="1150" y="308" font-size="13" fill="#33503c" text-anchor="end">content © Dr. Jacqueline Ghee</text>
</svg>
